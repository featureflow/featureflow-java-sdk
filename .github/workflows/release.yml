name: Release

# Publishes to Maven Central via the Sonatype Central Portal (central-publishing-maven-plugin,
# `mvn deploy -P sign,build-extras`), replacing the retired CircleCI pipeline. Triggered by
# publishing a GitHub Release, matching the other Featureflow SDKs; workflow_dispatch offers a
# dry run that builds and signs without uploading.
#
# Maven Central has no OIDC trusted publishing, so this uses the same four secrets as
# featureflow-android-sdk (same portal token, same signing key), on this repo's `release`
# environment: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY (ASCII-armoured
# private key), SIGNING_KEY_PASSWORD.
#
# Central is immutable: a released version cannot be deleted or overwritten, only superseded.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign everything without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check tag matches the pom version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "tag=$TAG_VERSION  pom=$POM_VERSION"
          case "$POM_VERSION" in
            *-SNAPSHOT) echo "::error::pom version is a SNAPSHOT — bump it before releasing"; exit 1 ;;
          esac
          [ "$TAG_VERSION" = "$POM_VERSION" ] || { echo "::error::tag != pom version"; exit 1; }

      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::SIGNING_KEY / SIGNING_KEY_PASSWORD not set on the 'release'"
            echo "::error::environment. Central rejects unsigned artifacts. Use the same"
            echo "::error::values as featureflow-android-sdk — see its RELEASING.md."
            exit 1
          fi
          case "$SIGNING_KEY" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
            *) echo "::error::SIGNING_KEY is not an armoured private key (missing BEGIN/END lines)"; exit 1 ;;
          esac
          # A paste that lost its newlines (single-line secret, or literal \n escapes) is the
          # most common way this secret goes wrong. Normalise before importing: expand
          # literal \n escapes, and if the armour is still one line, rebuild it — BEGIN line,
          # blank line, base64 body, END line. Armour contains no backslashes or spaces, so
          # both transformations are safe on a well-formed key.
          python3 - <<'PY' > /tmp/signing-key.asc
          import os, re, sys
          key = os.environ["SIGNING_KEY"].replace("\r\n", "\n").replace("\\n", "\n").strip()
          if "\n" not in key:
              m = re.match(r"-----BEGIN PGP PRIVATE KEY BLOCK-----(.*)-----END PGP PRIVATE KEY BLOCK-----$", key, re.S)
              if not m:
                  sys.exit("SIGNING_KEY is single-line and not delimited by BEGIN/END armour lines")
              body = "\n".join(m.group(1).split())
              key = "-----BEGIN PGP PRIVATE KEY BLOCK-----\n\n" + body + "\n-----END PGP PRIVATE KEY BLOCK-----"
          print(key)
          PY
          echo "signing key: $(wc -l < /tmp/signing-key.asc) lines after normalisation"
          gpg --batch --import /tmp/signing-key.asc
          rm -f /tmp/signing-key.asc
          KEYNAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEYNAME=$KEYNAME" >> "$GITHUB_ENV"
          echo "imported signing key $KEYNAME"

      - name: Sign and publish to Maven Central
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: mvn deploy -P sign,build-extras --settings settings.xml

      - name: Dry run — build and sign without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GPG_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: mvn verify -P sign,build-extras --settings settings.xml

      # Assert the outcome, not the input: the signature files must actually exist.
      - name: Verify the artifacts are signed
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          COUNT=$(find target -maxdepth 1 -name "*.asc" | wc -l)
          echo "found $COUNT signature files"
          find target -maxdepth 1 -name "*.asc"
          [ "$COUNT" -ge 2 ] || { echo "::error::expected signed jar+pom at minimum. Check the sign profile."; exit 1; }
