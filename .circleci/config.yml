version: 2.1
jobs:
    build:
        docker:
            - image: cimg/openjdk:17.0
        steps:
            - checkout
            - run: git submodule sync
            - run: git submodule update --init --recursive
            - restore_cache:
                  key: featureflow-server-{{ checksum "pom.xml" }}
            - run: mvn dependency:go-offline
            - save_cache:
                  paths:
                      - ~/.m2
                  key: featureflow-server-{{ checksum "pom.xml" }}
            - run: openssl version
            - run: gpg --version
            - run: export GPG_TTY=$(tty)
            - run: openssl aes-256-cbc -d -in codesigning.asc.enc -out codesigning.asc -k $ENCKEY -pbkdf2
            - run: gpg --batch --import codesigning.asc
            - run:
                  name: Build (deploy releases to Central; SNAPSHOTs are verified only, not published)
                  command: |
                      VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
                      if [[ "$VERSION" == *-SNAPSHOT ]]; then
                          echo "SNAPSHOT version ($VERSION): running verify only"
                          mvn verify
                      else
                          echo "Release version ($VERSION): signing and deploying to Central"
                          mvn deploy -P sign,build-extras --settings settings.xml
                      fi
            - store_test_results:
                  path: target/surefire-reports